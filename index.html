<script>
(function(){'use strict';
const LS='karargah_faz1_v1';
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const DS=['PZT','SAL','ÇAR','PER','CUM','CMT','PAZ'];
const DEFAULT_MANIFESTO=`BEN KİMİM VE NASIL ÇALIŞIRIM?
Tarihteki hiçbir büyük adam kusursuz doğmadı. Onlar da benim gibi etten, kemikten, sıfırdan gelen insanlardı. Onları imparatorlara, komutanlara ve kuruculara dönüştüren tek şey; sıradan insanlar bahanelerine sığınırken onların masada kalması, kendilerinden önceki büyükleri ders çalışır gibi incelemesi ve zihinlerini eğitmesiydi. Onlar insandı ve başardılar; ben de başaracağım.

Zihnim, disiplinli bir komutanın savaş karargâhıdır. Her düşünce, her sorumluluk ve her hedef, emrim altında ayrı birer birliktir. Masama aynı anda sadece tek bir cephenin haritasını açar, sahaya sadece o an görev verdiğim birliği sürerim; diğer tüm konuları emir sırası gelene kadar geride, kışlasında hazır bekletirim. Duygularım, sabırsızlığım veya anlık heveslerim kararlarımı yönetemez.

Ucuz başarı ve para hayalleriyle kendimi avutmam. Ben tatmini sonuçtan değil; saatlerce süren kesintisiz çalışmadan, çözdüğüm zor problemlerden ve kurduğum sistemin işleyişinden alırım.

Konuştuğumda acele etmem. Nefesim derin, sesim tok, kelimelerim net, duruşum diktir. Bedenimi her gün idmanla, zihnimi ise tarihin en güçlü liderlerinin disiplinini çalışarak keskinleştiriyorum.

HEDEFİM, SEÇTİĞİM YOLLAR VE KADERİM
İstediğim hayata ulaşmak için birbirini besleyen iki stratejik yolda aynı anda ilerliyorum:
Birincisi; asıl hedefim olan finansal piyasalarda, saf matematik ve algoritmalarla yılda yüz binlerce dolar üreten bir sermaye sistemi inşa etmek.
İkincisi; ikmal hattı olmayan bir ordunun savaşı kazanamayacağını bilerek, bu sistemi finanse edecek düzenli nakit akışını sağlamak ve algoritmalarım olgunlaşırken yerimde saymayıp DGS ve lisans sınavlarıyla devlet kademesinin en üst noktalarına tırmanarak hem gelirimi hem de statümü yükseltmek.

Biliyorum ki şans ve fırsat, yalnızca hazır olan zihinlere görünür. Bugün masada geçirdiğim her saat, çözdüğüm her problem ve okuduğum her kitap; yarın karşıma çıkacak büyük fırsatları başkaları göremezken benim anında görmemi ve yakalamamı sağlayacak olan hazırlığımdır.

İnsanım; şartlar değişebilir ve bazı günler düzenim bozulabilir. Ama beni diğerlerinden ayıran şey, düzenimin hiç bozulmaması değil; bozulduğu an bahane üretmeden zihnimi toparlayıp masama geri dönme hızımdır.

Zihnimi değiştirdikçe düşüncelerim, düşüncelerim değiştikçe hayatım değişiyor. Büyük bir adam olmak benim kaderimde var; ben bu ağır disiplini kaderimi değiştirmek için değil, zaten benim olan kaderi inşa etmek için yaşıyorum.`;
const H6_OLD='Gün Boyu & Gece Kapanışı',H6_NEW='Gün Boyu & 22:30 – 23:00 Gece Kapanışı';
const DEFAULT_HABITS=[
{id:'h1',identity:'Soğukkanlı Zihin',time:'08:00 – 08:30',action:'Diyafram Nefesi & A5 Manifesto Okuması',full:'10 dk (4-4-6 ritmi) nefes regülasyonu + A5 Manifestoyu sesli ve tok tonla okuma.',min:'3 dk derin nefes + Manifestoyu 1 kez okuma.',audit:'Diyafram gevşedi ve zihin hizalandı mı?',subs:[],tool:'breath'},
{id:'h2',identity:'Etkileyici Hatip',time:'08:30 – 08:42 | Ayna Karşısı',action:'Hitabet ve Otoriter Konuşma Antrenmanı (2 Aşamalı)',full:'5-7 dk İngilizce-Türkçe Çeviri Hitabeti + 5 dk "Yakala-Kaldır-Konuş" Teleprompter Okuması.',min:'2,5 dk Çeviri Hitabeti + 2,5 dk Teleprompter Okuması (Toplam 5 dk).',audit:'',tool:'',subs:[

'Aşama 1 (Nefes & Es): Konuşmadan önce üst nefes tahliye edildi, her 3-4 kelimede 1-2 sn otoriter sessizlik (es) verildi.',
'Aşama 1 (Stop-Reset): Takılma anında kelime zorlanmadı; anında durulup nefes verilerek cümle baştan kuruldu.',
'Aşama 2 (Yakala-Kaldır-Konuş): Metinden 3-4 kelime fotoğraflandı, baş kaldırılıp nefes verildi ve metne bakmadan aynaya konuşuldu.']},
{id:'h3',identity:'Yükselen Devlet Adamı',time:'09:00 – 12:00',action:'DGS Matematik Kampı (Alışkanlık İnşası)',full:'Soru adedi baskısı olmadan 2 - 3 Saat Odaklı Masa Başı Çalışma (KPSS Önlisans kaynaklarıyla konuyu anlama ve işlem pratiği).',min:'45 Dakika Kesintisiz Matematik Çalışması.',audit:'Soru sayısına değil, masa başı pürdikkat süresine sadık kalındı mı?',subs:[],tool:'timer',metric:'math',mMin:45,mFull:120},
{id:'h4',identity:'Çelik Disiplinli Atlet',time:'Sabah & 16:00 – 17:00',action:'Sabah Postür/Karın & İkindi Ağırlık İdmanı',full:'Sabah 15 dk Mobilite/Postür/Karın + İkindi 45 dk Ağırlık/Barfiks/Şınav idmanı.',min:'10 dk Postür Esneme + Karın idmanı.',audit:'Omurga dikliği ve fiziksel disiplin korundu mu?',subs:[],tool:''},
{id:'h5',identity:'Büyüklerin Öğrencisi',time:'20:30 – 22:00',action:'Pürdikkat Kitap Okuma',full:'Günde 60 - 80 Sayfa Okuma (Eldeki kitapların sırayla eritilip Napolyon biyografisine geçilmesi).',min:'15 Sayfa Okuma.',audit:'Eldeki kitaplar sırayla eritiliyor mu?',subs:[],tool:'book',metric:'pages',mMin:15,mFull:60},
{id:'h6',identity:'Karargâh Komutanı',time:H6_NEW,action:'Süreç Odağı (Sonuç Hayalini Kesme) & Gece Hazırlığı',full:'Gün içinde çalışırken puan/makam/para hayallerini bıçak gibi kesip sadece o anki cepheye odaklanma + Gece yarının matematik testini masaya açık bırakma.',min:'Günlük takip çizelgesini işaretleme ve masayı toplama.',audit:'Ucuz dopamin (sonuç hayali) kesilip sadece sürece odaklanıldı mı?',subs:[],tool:'cut'},
{id:'h7',identity:'Dinç Uyanan Komutan',time:'23:00 – 07:00',action:'Karartma: 23:00 Sonrası Yapay Işıksız Zaman & Uyku',full:"23:00'te tüm lambalar ve ekranlar kapanır; kalan zaman karanlıkta nefes ve sessizlikle geçer, ekrana dönülmeden uyunur (hedef 7–8 saat).",min:"En geç 23:30'da karartma; gece ekrana ya da ışığa en fazla 1 kısa dönüş.",audit:"23:00'ten sonra ekran ve yapay ışık tamamen kesildi mi?",subs:[],tool:'sleep',tolT:10,tolM:30}];

/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const clone=o=>JSON.parse(JSON.stringify(o)),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const up=s=>String(s||'').toLocaleUpperCase('tr-TR');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);};
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const keyNow=rh=>keyOf(new Date(Date.now()-(rh||0)*36e5));
const monday=k=>addDays(k,-((parseKey(k).getDay()+6)%7));
const fmt0=n=>Math.round(n).toLocaleString('tr-TR');
const fmt1=n=>n.toLocaleString('tr-TR',{minimumFractionDigits:1,maximumFractionDigits:1});
const hm=m=>{m=((Math.floor(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);};
const dur=m=>{m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;return h?(r?h+' sa '+r+' dk':h+' sa'):r+' dk';};
const hms=ms=>{const s=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);};
const mmss=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);};
const timeOf=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const ago=ts=>{const d=Math.floor((Date.now()-ts)/864e5);return d<=0?'bugün':d===1?'dün':d+' gün önce';};
const dateLong=k=>{const d=parseKey(k);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();};
const dateShort=k=>{const d=parseKey(k);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};
const done=v=>v===1||v===2;
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400);};
const nightMin=ts=>{const d=new Date(ts),m=d.getHours()*60+d.getMinutes();return d.getHours()<12?m+1440:m;};
const nowN=()=>nightMin(Date.now());
const clkRe=/^(\d{1,2}):(\d{2})/;
function offTsOf(k,c){const m=clkRe.exec(c||'');if(!m||+m[1]>23||+m[2]>59)return 0;const d=parseKey(k),h=+m[1];if(h<12)d.setDate(d.getDate()+1);d.setHours(h,+m[2],0,0);return d.getTime();}
function afterTs(ts,c){const m=clkRe.exec(c||'');if(!m||+m[1]>23||+m[2]>59)return 0;const d=new Date(ts);d.setHours(+m[1],+m[2],0,0);if(d.getTime()<=ts)d.setDate(d.getDate()+1);return d.getTime();}

/* ---------- veri ---------- */
function fresh(){return{v:2,settings:{start:keyNow(4),length:60,rollover:4,oneFront:false},manifesto:DEFAULT_MANIFESTO,habits:clone(DEFAULT_HABITS),
books:[{id:'bnap',title:'Napolyon Biyografisi',total:0,start:0,done:false,final:true}],days:{},timer:null,sleep:null,lastBackup:0};}
function normalize(o){const f=fresh();if(!o||typeof o!=='object')return f;const s=Object.assign({},f,o);
s.settings=Object.assign({},f.settings,o.settings||{});
if(!/^\d{4}-\d{2}-\d{2}$/.test(s.settings.start))s.settings.start=f.settings.start;
s.settings.length=Math.min(365,Math.max(7,parseInt(s.settings.length)||60));
s.settings.rollover=Math.min(6,Math.max(0,parseInt(s.settings.rollover)||0));
if(typeof s.manifesto!=='string'||!s.manifesto.trim())s.manifesto=DEFAULT_MANIFESTO;
if(!Array.isArray(s.habits)||!s.habits.length)s.habits=clone(DEFAULT_HABITS);
s.habits=s.habits.map(h=>Object.assign({audit:'',tool:''},h,{subs:Array.isArray(h.subs)?h.subs:[]}));
if((+o.v||1)<2)s.habits.forEach(h=>{if(h.id==='h6'&&h.time===H6_OLD)h.time=H6_NEW;});

backup:async()=>{const name='karargah-yedek-'+todayKey()+'.json',json=JSON.stringify(S);let ok=false;
try{const f=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});ok=true;}}catch(e){if(e&&e.name==='AbortError')return;}
if(!ok){const u=URL.createObjectURL(new Blob([json],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
S.lastBackup=Date.now();save();renderAyar();updateDot();toast('Yedek hazırlandı');},
copy:async()=>{const j=JSON.stringify(S);try{await navigator.clipboard.writeText(j);S.lastBackup=Date.now();save();renderAyar();updateDot();toast('Yedek panoya kopyalandı — Notlar’a yapıştırıp sakla');}
catch(e){openSheet('YEDEK METNİ',`<textarea class="ta" style="min-height:40vh" readonly>${esc(j)}</textarea><div class="hint">Metni seçip kopyala.</div>`,[]);}},
imp:()=>$('#impFile').click(),
paste:()=>openSheet('METİNDEN GERİ YÜKLE','<textarea class="ta" id="pTxt" style="min-height:40vh" placeholder="Yedek JSON metnini yapıştır"></textarea>',[{label:'GERİ YÜKLE',cls:'gold',act:'pasteGo'}]),
pasteGo:()=>doImport($('#pTxt').value),
wipe:()=>{if(!confirm('TÜM veriler silinecek. Önce yedek aldın mı?')||!confirm('Son onay: geri dönüşü yok. Silinsin mi?'))return;S=fresh();save();U.today=todayKey();goDay(U.today);renderAll();toast('Sıfırlandı');},
shClose:closeSheet};

/* ---------- olaylar ---------- */
const coarse=window.matchMedia&&matchMedia('(pointer: coarse)').matches;
document.addEventListener('click',e=>{const t=e.target;if(t.id==='sheet'){closeSheet();return;}
if(t.classList&&t.classList.contains('dp')){if(!coarse&&t.showPicker)try{t.showPicker();}catch(_){}return;}
const el=t.closest&&t.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el,e);});
const slIn=el=>{if(el.id!=='slOff'&&el.id!=='slWake')return false;if(U.slf){U.slf[el.id==='slOff'?'off':'wake']=el.value;slfPaint();}return true;};
document.addEventListener('input',e=>{const el=e.target;if(slIn(el))return;const f=el.dataset&&el.dataset.f;if(!f||U.sel>todayKey())return;
if(f==='note'){DW(U.sel).note=el.value.slice(0,4000);save();return;}
let v=parseInt(el.value,10);if(isNaN(v)||v<0)v=0;setMetric(f,Math.min(v,f==='math'?1440:5000),false);});
document.addEventListener('change',e=>{const el=e.target;if(slIn(el))return;
if(el.classList.contains('dp')){if(el.value){goDay(el.value);renderOp();}return;}
if(el.id==='impFile'){const f=el.files&&el.files[0];if(f){const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f);}el.value='';return;}
const k=el.dataset.set;if(!k)return;
if(k==='start'){if(!/^\d{4}-\d{2}-\d{2}$/.test(el.value))return;S.settings.start=el.value;}
if(k==='length')S.settings.length=Math.min(365,Math.max(7,parseInt(el.value,10)||60));
if(k==='rollover')S.settings.rollover=parseInt(el.value,10)||0;
save();U.today=todayKey();goDay(U.today);U.rw=null;renderHeader();renderAyar();toast('Kamp ayarı güncellendi');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeFs('fsRead');closeSleepFs();}});
function checkDay(){const T=todayKey();
if(T!==U.today){const was=U.sel===U.today;U.today=T;if(was)goDay(T);renderAll();return;}
renderSleepBar();
if(U.tab==='op'&&U.sel===T){const f=front(),sig=f?f.mode+f.h.id:'';renderFront();if(sig!==U.frontSig)renderHabits();}}
setInterval(tick,1000);setInterval(checkDay,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkDay();tick();if(S.sleep&&!slFsOn())openSleepFs();}});

/* ---------- ana ekran / PWA ---------- */
function drawIcon(sz){const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d'),u=sz/512;
x.fillStyle='#0d0f12';x.fillRect(0,0,sz,sz);x.strokeStyle='#d4af37';x.lineWidth=10*u;x.strokeRect(72*u,72*u,368*u,368*u);
x.lineWidth=34*u;x.lineJoin='miter';[0,1,2].forEach(i=>{const y=(162+i*62)*u;x.beginPath();x.moveTo(156*u,y+64*u);x.lineTo(256*u,y);x.lineTo(356*u,y+64*u);x.stroke();});
return c.toDataURL('image/png');}
function pwa(){try{const add=(r,h)=>{const l=document.createElement('link');l.rel=r;l.href=h;document.head.appendChild(l);};
const i180=drawIcon(180),i192=drawIcon(192),i512=drawIcon(512);add('apple-touch-icon',i180);add('icon',i192);
if(/^https?:$/.test(location.protocol)){const base=location.href.split('#')[0].split('?')[0];
const m={name:'Karargâh · Faz 1',short_name:'Karargâh',start_url:base,scope:base.slice(0,base.lastIndexOf('/')+1),display:'standalone',background_color:'#0d0f12',theme_color:'#0d0f12',lang:'tr',
icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
add('manifest',URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})));
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}}

/* ---------- başlat ---------- */
U.today=todayKey();goDay(U.today);pwa();renderAll();
const KR=`<p><b>Karartma (${hm(slTarget(sleepH()))}):</b> Işıkları ve ekranları kapatırken KARARTMAYI BAŞLAT'a dokun, telefonu uzağa koy. Sabah UYANDIM de; karartma saati, süre ve değerlendirme kaydedilir. Telefona hiç dokunmadan uyuduysan sabah "Dün gecenin kaydını gir".</p>`;
if(!S.onb){S.onb=2;save();openSheet('FAZ 1 KAMPI BAŞLADI',`<div class="txt"><p><b>Başlangıç: ${dateLong(S.settings.start)}.</b> Farklı bir tarihte başladıysan Ayarlar'dan değiştir.</p>
<p><b>Her cephede 3 emir:</b> TAM HEDEF (%100) · MİNİMUM (%50, seri korunur) · YAPILMADI (seri sıfırlanır). Aynı butona tekrar dokunmak işareti kaldırır.</p>
<p><b>Kural:</b> Bir gün aksarsa ertesi gün o kartta kırmızı uyarı çıkar. İki gün üst üste aksatma yok.</p>
<p><b>Eritme Listesi:</b> Eldeki kitaplarını Ayarlar'dan sırayla ekle; Napolyon biyografisi hedef olarak sonda bekliyor.</p>${KR}</div>`,[{label:'KARARGÂHA GİR',cls:'gold',act:'shClose'}]);}
else if(S.onb<2){S.onb=2;save();openSheet('YENİ CEPHE: KARARTMA',`<div class="txt">${KR}<p>Karartma Raporu Rapor sekmesinde; toleranslar Ayarlar › Alışkanlıklar bölümünde.</p></div>`,[{label:'ANLAŞILDI',cls:'gold',act:'shClose'}]);}
if(S.sleep)openSleepFs();
})();
</script>
</body>
